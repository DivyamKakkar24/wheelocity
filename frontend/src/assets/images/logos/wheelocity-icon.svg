<svg width="160" height="160" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Wheelocity icon">
  <g transform="translate(80,84)">
    <!-- gold outer ring -->
    <circle cx="0" cy="0" r="56" fill="none" stroke="#C9A66B" stroke-width="2"/>
    <!-- speedometer dial: teal track arc (open at bottom) -->
    <path d="M-40 34 A52 52 0 1 1 40 34" fill="none" stroke="#5EEAD4" stroke-width="8" stroke-linecap="round"/>
    <!-- graphite inner arc under it for depth -->
    <path d="M-30 26 A40 40 0 1 1 30 26" fill="none" stroke="#1E2124" stroke-width="4" opacity="0.15"/>
    <!-- tick marks around dial -->
    <g stroke="#1E2124" stroke-width="3" stroke-linecap="round">
      <line x1="-34" y1="-20" x2="-28" y2="-16"/>
      <line x1="-20" y1="-33" x2="-16" y2="-27"/>
      <line x1="0"  y1="-40" x2="0"   y2="-32"/>
      <line x1="20" y1="-33" x2="16"  y2="-27"/>
      <line x1="34" y1="-20" x2="28"  y2="-16"/>
    </g>
    <!-- needle pointing to high speed (upper right), teal -->
    <line x1="0" y1="0" x2="26" y2="-20" stroke="#1E2124" stroke-width="6" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="24" y2="-18" stroke="#5EEAD4" stroke-width="3" stroke-linecap="round"/>
    <!-- hub -->
    <circle cx="0" cy="0" r="8" fill="#1E2124"/>
    <circle cx="0" cy="0" r="3" fill="#C9A66B"/>
    <!-- motion lines trailing left -->
    <g stroke="#5EEAD4" stroke-linecap="round">
      <line x1="-60" y1="6"  x2="-82" y2="6"  stroke-width="5" opacity="0.85"/>
      <line x1="-58" y1="18" x2="-74" y2="18" stroke-width="5" opacity="0.5"/>
    </g>
  </g>
</svg>
